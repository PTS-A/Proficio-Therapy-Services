<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verifying Identity &bull; Credentialing Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2B4C9D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #0f172a; }
    p { font-size: 13px; color: #64748b; margin: 0 0 16px 0; line-height: 1.5; }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #eff6ff;
      color: #1d4ed8;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading-spinner" class="spinner"></div>
    <div class="status-badge">Google Verification</div>
    <h2>Verifying Identity...</h2>
    <p>Completing authentication and loading your workspace.</p>
  </div>

  <script>
    (function() {
      var currentSearch = window.location.search || '';
      var currentHash = window.location.hash || '';

      // If opened in a popup window, attempt to inform the main window
      if (window.opener && !window.opener.closed) {
        try {
          var params = new URLSearchParams(currentSearch.replace(/^\?/, ''));
          var hashParams = new URLSearchParams(currentHash.replace(/^#/, ''));
          var code = params.get('code');
          var sessionId = params.get('session_id') || params.get('state');
          var accessToken = hashParams.get('access_token');

          window.opener.postMessage({
            type: 'OAUTH_REDIRECT_PAYLOAD',
            code: code,
            accessToken: accessToken,
            sessionId: sessionId,
            search: currentSearch,
            hash: currentHash
          }, '*');
        } catch (e) {}
      }

      // Forward query parameters and hash to the root SPA router
      var targetUrl = '/' + currentSearch + currentHash;
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 100);
    })();
  </script>
</body>
</html>
